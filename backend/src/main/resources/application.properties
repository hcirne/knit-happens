spring.application.name=knit-happens

# Read the shared ../.env (the same file docker-compose uses) when it exists.
# The backend runs inside backend/, so the file is one folder up.
spring.config.import=optional:file:../.env[.properties]

# --- Database (values come from .env; the defaults match .env.example) ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:knit_happens}
spring.datasource.username=${POSTGRES_USER:knit}
spring.datasource.password=${POSTGRES_PASSWORD:knit_local_dev}

# Hibernate never changes tables, it only checks that the entities match them.
# Only Flyway (src/main/resources/db/migration) changes the schema.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep the database session open while the view is rendered.
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Photo uploads (UC-04): 5 MB per file, at most 5 files per request ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Login session lasts 7 days
server.servlet.session.timeout=7d

# Where photo files are stored (relative to backend/ when started from there)
knit.upload-dir=${UPLOAD_DIR:./uploads}
