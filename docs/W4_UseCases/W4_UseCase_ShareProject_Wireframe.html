
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knit happens – Share project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f3f3;
      color: #222;
      font: 16px Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1020px;
      margin: 35px auto;
      background: white;
      border: 2px solid #444;
      border-radius: 12px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 20px 28px;
      border-bottom: 2px solid #444;
      background: #fafafa;
    }
    .brand { font-size: 19px; font-weight: bold; white-space: nowrap; }
    nav { display: flex; gap: 28px; font-size: 15px; color: #555; }
    nav .active { color: #222; font-weight: bold; text-decoration: underline; text-underline-offset: 7px; }
    main { padding: 32px 48px 44px; }
    h1 { margin: 0 0 9px; font-size: 28px; }
    .subheading { margin: 0 0 30px; color: #666; }
    .form-group { margin: 0 0 24px; }
    label { display: block; font-weight: bold; margin-bottom: 9px; }
    input[type="text"], textarea {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #555;
      border-radius: 8px;
      background: white;
      color: #222;
      font: inherit;
    }
    textarea { min-height: 130px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #888; }
    .upload {
      width: 100%;
      min-height: 180px;
      border: 2px dashed #777;
      border-radius: 10px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }
    .picture {
      width: 58px;
      height: 46px;
      border: 2px solid #666;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .picture:before {
      content: "";
      display: block;
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 100%;
      background: #aaa;
      right: 8px;
      top: 7px;
    }
    .picture:after {
      content: "";
      position: absolute;
      width: 55px;
      height: 34px;
      background: #aaa;
      left: 0;
      top: 25px;
      transform: rotate(-39deg);
    }
    .hint { color: #777; font-size: 14px; }
    .actions { margin-top: 30px; display: flex; gap: 12px; }
    button {
      padding: 11px 29px;
      background: #e6e6e6;
      border: 2px solid #444;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: #555; color: white; }
    .error { display: none; color: #8a2727; margin-top: 8px; font-size: 14px; }
    .form-group.invalid .error { display: block; }
    .form-group.invalid input, .form-group.invalid textarea, .form-group.invalid .upload { border-color: #8a2727; }
    #file { display: none; }
    #files-chosen { font-size: 14px; color: #555; margin-top: 8px; }
    #status { margin: 20px 0 0; font-size: 14px; color: #333; }
    @media (max-width: 650px) {
      .page { margin: 0; border-radius: 0; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 16px; }
      nav { flex-wrap: wrap; gap: 18px; }
      main { padding: 26px 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">KNIT HAPPENS</div>
      <nav aria-label="Main navigation">
        <span>Home</span>
        <span>Projects</span>
        <span>Marketplace</span>
        <span class="active">Share project</span>
      </nav>
    </header>
    <main>
      <h1>Share project</h1>
      <p class="subheading">Share your finished knitting project with the community.</p>
      <form id="share-form" novalidate>
        <div class="form-group" id="title-group">
          <label for="project-title">Project title *</label>
          <input id="project-title" type="text" placeholder="e.g. Cozy Winter Scarf" required>
          <p class="error">Please enter a project title.</p>
        </div>
        <div class="form-group" id="description-group">
          <label for="description">Description *</label>
          <textarea id="description" placeholder="Describe your knitting project..." required></textarea>
          <p class="error">Please enter a description.</p>
        </div>
        <div class="form-group" id="photo-group">
          <label for="file">Project photos *</label>
          <label class="upload" for="file">
            <span class="picture" aria-hidden="true"></span>
            <strong>Click to upload photos</strong>
            <span class="hint">Choose one or more project photos</span>
          </label>
          <input type="file" id="file" accept="image/*" multiple>
          <div id="files-chosen" aria-live="polite"></div>
          <p class="error">Please select valid image files.</p>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Publish</button>
          <button type="reset">Clear</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script>
    const form = document.getElementById('share-form');
    const fileInput = document.getElementById('file');
    const status = document.getElementById('status');
    fileInput.addEventListener('change', () => {
      document.getElementById('files-chosen').textContent =
        [...fileInput.files].map(file => file.name).join(', ');
      document.getElementById('photo-group').classList.remove('invalid');
      status.textContent = '';
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const titleOk = !!document.getElementById('project-title').value.trim();
      const descriptionOk = !!document.getElementById('description').value.trim();
      const files = [...fileInput.files];
      const photosOk = files.length > 0 && files.every(file => file.type.startsWith('image/'));
      document.getElementById('title-group').classList.toggle('invalid', !titleOk);
      document.getElementById('description-group').classList.toggle('invalid', !descriptionOk);
      document.getElementById('photo-group').classList.toggle('invalid', !photosOk);
      status.textContent = titleOk && descriptionOk && photosOk
        ? 'Wireframe preview: your project would now be published and shown in the project feed.'
        : '';
    });
    form.addEventListener('reset', () => {
      document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
      document.getElementById('files-chosen').textContent = '';
      status.textContent = '';
    });
  </script>
</body>
</html>
